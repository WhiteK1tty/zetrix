<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Zetrix</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon" id="logoIcon"></span>
        <span class="logo-text">Zetrix</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="index.html#features">Функции</a></li>
        <li><a href="index.html#pricing">Цены</a></li>
      </ul>
      <div class="nav-actions">
        <a href="login.html" class="btn-ghost">Войти</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-logo">
        <span id="authLogoIcon"></span>
        <span class="logo-text">Zetrix</span>
      </div>
      <h1 class="auth-title">Создать аккаунт</h1>
      <p class="auth-sub">Присоединяйся к 12K+ игроков</p>

      <form class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Никнейм</label>
          <div class="input-wrap">
            <span class="input-icon" id="iconUser"></span>
            <input type="text" class="form-input" id="regUsername" placeholder="your_nickname" required minlength="3" maxlength="20" />
          </div>
          <span class="form-hint">От 3 до 20 символов</span>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrap">
            <span class="input-icon" id="iconMail"></span>
            <input type="email" class="form-input" placeholder="example@mail.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="input-wrap">
            <span class="input-icon" id="iconLock1"></span>
            <input type="password" class="form-input" id="regPassword" placeholder="Минимум 8 символов" required minlength="8" oninput="checkPasswordStrength(this.value)" />
            <button type="button" class="input-toggle" id="toggleReg1" onclick="togglePassword('regPassword', this)"></button>
          </div>
          <div class="password-strength">
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel">Введите пароль</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Подтвердите пароль</label>
          <div class="input-wrap">
            <span class="input-icon" id="iconLock2"></span>
            <input type="password" class="form-input" id="regPasswordConfirm" placeholder="Повторите пароль" required />
            <button type="button" class="input-toggle" id="toggleReg2" onclick="togglePassword('regPasswordConfirm', this)"></button>
          </div>
        </div>

        <div class="form-check">
          <label class="check-label">
            <input type="checkbox" class="check-input" required />
            <span class="check-box"></span>
            Я принимаю <a href="#" class="auth-link">условия использования</a>
          </label>
        </div>

        <button type="submit" class="btn-primary full large auth-submit">
          Создать аккаунт
        </button>
      </form>

      <div class="auth-divider"><span>или</span></div>

      <div class="auth-footer-text">
        Уже есть аккаунт? <a href="login.html" class="auth-link">Войти</a>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="transitions.js"></script>
  <script src="modal.js"></script>
  <script type="module" src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('logoIcon').innerHTML     = Icons.logo;
      document.getElementById('authLogoIcon').innerHTML = Icons.logo;
      document.getElementById('iconUser').innerHTML     = Icons.user;
      document.getElementById('iconMail').innerHTML     = Icons.mail;
      document.getElementById('iconLock1').innerHTML    = Icons.lock;
      document.getElementById('iconLock2').innerHTML    = Icons.lock;
      document.getElementById('toggleReg1').innerHTML   = Icons.eye;
      document.getElementById('toggleReg2').innerHTML   = Icons.eye;
    });
  </script>
</body>
</html>

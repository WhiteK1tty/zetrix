<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Войти — Zetrix</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon" id="logoIcon"></span>
        <span class="logo-text">Zetrix</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="index.html#features">Функции</a></li>
        <li><a href="index.html#pricing">Цены</a></li>
      </ul>
      <div class="nav-actions">
        <a href="register.html" class="btn-primary">Регистрация</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-logo">
        <span id="authLogoIcon"></span>
        <span class="logo-text">Zetrix</span>
      </div>
      <h1 class="auth-title">Добро пожаловать</h1>
      <p class="auth-sub">Войдите в свой аккаунт</p>

      <form class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email или логин администратора</label>
          <div class="input-wrap">
            <span class="input-icon" id="iconUser"></span>
            <input type="text" class="form-input" id="loginIdentifier" placeholder="your@email.com или ADMINSYSTEM" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            Пароль
            <a href="#" class="form-label-link">Забыли пароль?</a>
          </label>
          <div class="input-wrap">
            <span class="input-icon" id="iconLock"></span>
            <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required />
            <button type="button" class="input-toggle" id="toggleLogin" onclick="togglePassword('loginPassword', this)"></button>
          </div>
        </div>

        <div class="form-check">
          <label class="check-label">
            <input type="checkbox" class="check-input" />
            <span class="check-box"></span>
            Запомнить меня
          </label>
        </div>

        <button type="submit" class="btn-primary full large auth-submit">
          Войти в аккаунт
        </button>
      </form>

      <div class="auth-divider"><span>или</span></div>

      <div class="auth-footer-text">
        Нет аккаунта? <a href="register.html" class="auth-link">Зарегистрироваться</a>
      </div>
    </div>
  </div>

<script type="module">
    import { auth } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'profile.html'; });
  </script>

  <script src="icons.js"></script>
  <script src="transitions.js"></script>
  <script src="modal.js"></script>
  <script type="module" src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('logoIcon').innerHTML     = Icons.logo;
      document.getElementById('authLogoIcon').innerHTML = Icons.logo;
      document.getElementById('iconUser').innerHTML     = Icons.user;
      document.getElementById('iconLock').innerHTML     = Icons.lock;
      document.getElementById('toggleLogin').innerHTML  = Icons.eye;
    });
  </script>
</body>
</html>
